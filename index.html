    <!DOCTYPE html>
    <html lang="es">
    <head>

        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Benvigut a la Meva Pàgina Web</h1>
        </header>
        <nav>
            <ul>
                <li><a href="#home">Inici</a></li>
                <li><a href="#about">Sobre Mi</a></li>
                <li><a href="#contact">Contacte</a></li>

            </ul>
        </nav>
        <main>
            <section id="home">
                <h2>Inici</h2>
                <p>Aquesta és una pàgina web d'exemple amb errors.</p>
            </section>
            <section id="about">
                <h2>Sobre Mi</h2>
                <p>He creat aquesta pàgina per demostrar alguns errors comuns.</p>
            </section>
            <section id="contact">
                <h2>Contacte</h2>
                <form>
                    <label for="name">Nom:</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>

        </footer>
